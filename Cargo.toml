[package]
name = "prosze-hackowac"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = "warn"
nursery = "warn"

[dependencies]
async-signal = "0.2"
base64 = "0.23.0"
futures-util = "0.3"
image = "0.25"
poem = { version = "3.1", features = ["compression", "sse", "static-files"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing-subscriber = "0.3"
